name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The evaluator may delete generated artifacts: prove the pipeline regenerates them with no API key.
      - name: Delete committed artifacts
        run: rm -f outputs/*.json outputs/*.jsonl outputs/*.md
      - name: Run pipeline offline
        run: python main.py
      - name: Validate artifacts
        run: python validate.py
      - name: Unit and integration tests
        run: python -m pytest -q
